# Your settings for repo-tools. Copy this file to config.toml, which git ignores, and
# edit it. A setting left out takes the default shown here.

# Where repo-list and repo-fix look when given no directory.
root = "~/projects"

[packagist]
# Your Packagist vendor name. With --packagist, repo-list checks, and repo-fix publishes and
# updates, each repository whose composer.json names a package of this vendor's. Leave it out
# if you don't publish to Packagist.
vendor = "your-vendor"

[npm]
# Your npm scope. With --npm, repo-list checks, and repo-fix publishes and waits for, each
# repository whose package.json names a package in this scope and isn't private. Leave it out
# if you don't publish to npm.
scope = "@your-scope"

[bitbucket]
# The Bitbucket workspace a repo given by bare name is in, and that `bitbucket publish` creates
# repos in. Leave it out if you don't use Bitbucket, or always name repos as workspace/name.
workspace = "your-workspace"

[description]
# Who writes a new GitHub or Bitbucket repo's description when its manifest has none: claude
# (through Claude Code, signed in as you), openai, gemini or mistral (through their APIs, with a
# key from your credential store), or none.
provider = "claude"
