[project]
name = "repo-tools"
version = "0.1.0"
description = "Command line tools for repositories: publishing them on GitHub and Packagist, and reporting and fixing the state of every one under a folder."
requires-python = ">=3.13"
dependencies = ["cli-kit"]

[project.scripts]
github = "repo_tools.github.__main__:main"
bitbucket = "repo_tools.bitbucket.__main__:main"
packagist = "repo_tools.packagist.__main__:main"
repo-list = "repo_list:main"
repo-fix = "repo_list.fix:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["repo_tools", "repo_list"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
